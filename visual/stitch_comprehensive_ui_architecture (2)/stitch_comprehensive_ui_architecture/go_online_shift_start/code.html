<script>
        let isOnline = false;

        function toggleShift() {
            const btn = document.getElementById('shiftButton');
            const fill = document.getElementById('btnFill');
            const thumb = document.getElementById('btnThumb');
            const text = document.getElementById('btnText');
            const icon = document.getElementById('btnIcon');

            isOnline = !isOnline;

            if (isOnline) {
                // Animate to Online State
                fill.style.width = '100%';
                thumb.style.transform = 'translateX(176px)'; // Move thumb to right
                text.textContent = 'ONLINE';
                icon.textContent = 'sensors';
                icon.classList.remove('text-primary');
                icon.classList.add('text-neighborhood-green');
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-neighborhood-green');
                
                // Vibrate if mobile supported
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(100);
                }
            } else {
                // Animate to Offline State
                fill.style.width = '0%';
                thumb.style.transform = 'translateX(0)';
                text.textContent = 'GO ONLINE';
                icon.textContent = 'local_shipping';
                icon.classList.add('text-primary');
                icon.classList.remove('text-neighborhood-green');
                btn.classList.add('bg-primary');
                btn.classList.remove('bg-neighborhood-green');
            }
        }

        // Add subtle entrance animations for progress bars
        document.addEventListener('DOMContentLoaded', () => {
            const progress = document.getElementById('goalProgress');
            setTimeout(() => {
                progress.style.width = '45%';
            }, 300);
        });
    </script>
