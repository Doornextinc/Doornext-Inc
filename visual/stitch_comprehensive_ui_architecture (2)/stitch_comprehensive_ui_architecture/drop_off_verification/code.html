<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar (Suppressing Shell as per Focus Task Mandate) -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-container-padding-mobile py-4 max-w-2xl mx-auto">
<div class="flex items-center gap-4">
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-variant/50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-primary">Drop-off</h1>
</div>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant px-3 py-1 bg-surface-variant rounded-full">LIVE TRIP</span>
</div>
</header>
<main class="flex-1 w-full max-w-2xl px-container-padding-mobile py-6 mb-24">
<!-- Delivery Summary Card -->
<section class="mb-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
<div class="bg-surface-lowest rounded-xl border border-outline-variant p-5 shadow-sm">
<div class="flex justify-between items-start mb-4">
<div>
<p class="font-label-sm text-label-sm text-primary mb-1">CUSTOMER</p>
<h2 class="font-title-lg text-title-lg text-on-surface">Priya S.</h2>
</div>
<div class="h-12 w-12 rounded-full overflow-hidden border-2 border-primary-container">
<img class="w-full h-full object-cover" data-alt="A friendly, high-quality portrait of a South Asian woman with a warm smile, wearing casual modern attire. The lighting is soft and natural, emphasizing a neighborhood community feel. The background is a clean, softly blurred modern home interior with warm wood tones and bright light-mode colors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCe-xhk3uycSytt3DOoedhzAe0RAsakye_Ekm3nRPu4-Fm82CoUpMpjMwInJvAXJTyiIQm7NnyKN-NRtqfm3LjyqK0miEd8zo_pZ6xx-HlGA0ndhhT6mIO9wWb67FLbiJa-vyRvg5F221ySRe21k-SHXCvA4LbHEvs_j3lQVr58ifCTlxkh4ohRWI8tbTAoXeteu6Agz8ZEu5Oc69O2IMHPd3KQoxZZRBE08y-KI8qio8isXzRQhuXOuFtVcCN3J4NK9r_u-Jh2SBC4"/>
</div>
</div>
<div class="flex items-start gap-3 text-on-surface-variant">
<span class="material-symbols-outlined text-primary mt-0.5">location_on</span>
<div>
<p class="font-body-md text-body-md font-semibold">123 Maple St</p>
<p class="font-label-sm text-label-sm">Highland Park neighborhood</p>
</div>
</div>
</div>
</section>
<!-- Verification Steps -->
<div class="space-y-6">
<!-- Photo Verification Section -->
<section>
<div class="flex items-center justify-between mb-4">
<h3 class="font-title-lg text-title-lg">Proof of Delivery</h3>
<span class="font-label-sm text-label-sm text-neighborhood-green flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">lock</span> SECURE
                    </span>
</div>
<div class="relative group cursor-pointer overflow-hidden rounded-xl bg-surface-container-highest aspect-[4/3] border-2 border-dashed border-outline-variant flex flex-col items-center justify-center hover:border-primary transition-all duration-300" id="camera-trigger">
<!-- Default State -->
<div class="text-center p-8" id="photo-placeholder">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform duration-300 shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-3xl">photo_camera</span>
</div>
<p class="font-title-lg text-title-lg text-on-surface mb-1">Take Photo</p>
<p class="font-body-md text-body-md text-on-surface-variant">Capture package at front door</p>
</div>
<!-- Image Preview (Hidden by default) -->
<div class="hidden absolute inset-0 w-full h-full" id="photo-preview">

<span class="material-symbols-outlined">edit</span>
</button>
</div>
<div class="absolute bottom-0 left-0 right-0 p-4 camera-overlay">
<p class="text-white font-label-sm text-label-sm flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">verified</span> TIMESTAMP: 2:45 PM
                             </p>
</div>
</div>
</div>
</section>
<!-- Delivery Notes Section -->
<section>
<label class="block font-title-lg text-title-lg mb-4" for="delivery-notes">Delivery Notes</label>
<div class="relative">
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:ring-2 focus:ring-primary focus:bg-surface-lowest transition-all" id="delivery-notes" placeholder="e.g. Left on front porch behind the pillar..." rows="3"></textarea>
<div class="absolute bottom-3 right-3 flex gap-2">
<button class="px-3 py-1 bg-surface-container rounded-full font-label-sm text-label-sm text-on-surface-variant hover:bg-secondary-container transition-colors">
                            Quick: Porch
                        </button>
</div>
</div>
</section>
</div>
<!-- Confirm Action (Sticky to bottom) -->
<div class="fixed bottom-0 left-0 right-0 p-container-padding-mobile bg-gradient-to-t from-surface via-surface to-transparent pt-12 pb-8 pointer-events-none">
<div class="max-w-2xl mx-auto w-full pointer-events-auto">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-5 rounded-full shadow-lg btn-active-state transition-all duration-200 flex items-center justify-center gap-3 disabled:opacity-50 disabled:grayscale" id="confirm-btn">
<span>Confirm Drop-off</span>
<span class="material-symbols-outlined">check_circle</span>
</button>
</div>
</div>
</main>
<script>
        // Micro-interaction for the camera trigger
        const cameraTrigger = document.getElementById('camera-trigger');
        const photoPlaceholder = document.getElementById('photo-placeholder');
        const photoPreview = document.getElementById('photo-preview');
        const confirmBtn = document.getElementById('confirm-btn');

        cameraTrigger.addEventListener('click', () => {
            // Mocking camera capture
            photoPlaceholder.classList.add('hidden');
            photoPreview.classList.remove('hidden');
            cameraTrigger.classList.remove('border-dashed');
            cameraTrigger.classList.add('border-primary');
            
            // Add a subtle success pulse
            cameraTrigger.classList.add('ring-4', 'ring-primary/20');
            setTimeout(() => cameraTrigger.classList.remove('ring-4'), 600);
        });

        // Quick button selection
        const quickButtons = document.querySelectorAll('button[class*="Quick:"]');
        const textArea = document.getElementById('delivery-notes');
        
        quickButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.textContent.replace('Quick: ', '').trim();
                textArea.value = `Left on ${text.toLowerCase()}.`;
                btn.classList.add('bg-primary', 'text-on-primary');
                setTimeout(() => btn.classList.remove('bg-primary', 'text-on-primary'), 500);
            });
        });

        // Confirm button logic
        confirmBtn.addEventListener('click', () => {
            confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...';
            confirmBtn.disabled = true;
            
            setTimeout(() => {
                confirmBtn.innerHTML = '<span class="material-symbols-outlined">task_alt</span> Delivered!';
                confirmBtn.classList.replace('bg-primary', 'bg-neighborhood-green');
                
                // Final success transition
                setTimeout(() => {
                    document.body.classList.add('opacity-0', 'transition-opacity', 'duration-700');
                    // Logic would redirect home here
                }, 1000);
            }, 1500);
        });
    </script>
